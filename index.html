<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <nav class="nav">
      <a class="brand" href="index.html">My Wishlist</a>
      <a class="admin-link" href="admin.html">Manage</a>
    </nav>
    <div class="hero-content">
      <p class="eyebrow">A little collection of things I want</p>
      <h1>My Wishlist</h1>
      <p>Want to get me something? Pick an item below and reserve it so nobody else buys the same thing.</p>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div>
        <h2>Wishlist</h2>
        <p id="item-count">0 items</p>
      </div>
      <input id="search" type="search" placeholder="Search wishlist...">
    </section>
    <section id="wishlist" class="grid"></section>
    <div id="empty-state" class="empty hidden">
      <h3>No items found</h3>
      <p>Try a different search.</p>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="close-modal" class="close" aria-label="Close">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
